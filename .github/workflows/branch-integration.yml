name: Safe branch integration audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: safe-branch-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Audit branch proposals and safely auto-merge verified PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          repo_json="$(gh api "repos/$GH_REPO")"
          auto_merge_enabled="$(jq -r '.allow_auto_merge // false' <<<"$repo_json")"
          mapfile -t branches < <(gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name')
          prs_json="$(gh pr list --repo "$GH_REPO" --state open --limit 500 --json number,headRefName,baseRefName,isDraft)"

          untracked=()
          for branch in "${branches[@]}"; do
            [[ "$branch" == "$DEFAULT_BRANCH" ]] && continue
            existing="$(jq -r --arg b "$branch" '[.[] | select(.headRefName == $b)] | length' <<<"$prs_json")"
            if [[ "$existing" == "0" ]]; then
              untracked+=("$branch")
            fi
          done

          {
            echo "### Safe branch integration audit"
            echo "- Default branch: `$DEFAULT_BRANCH`"
            echo "- Branches discovered: ${#branches[@]}"
            echo "- Open pull requests: $(jq 'length' <<<"$prs_json")"
            echo "- Branches without an open PR: ${#untracked[@]}"
            if [[ ${#untracked[@]} -gt 0 ]]; then
              echo
              echo "#### Branches awaiting an explicit PR proposal"
              for branch in "${untracked[@]}"; do
                echo "- `$branch`"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Do not repeatedly attempt PR creation when the Actions token is
          # not permitted to create pull requests. Report candidates instead.
          if [[ ${#untracked[@]} -gt 0 ]]; then
            echo "::notice::${#untracked[@]} branches have no open PR; this audit did not create PRs."
          fi

          # GitHub auto-merge must be enabled at repository level.
          if [[ "$auto_merge_enabled" != "true" ]]; then
            echo "::warning::Repository allow_auto_merge is false; no pull requests were merged."
            echo "- Auto-merge: disabled in repository settings; no merge attempted." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          while IFS=$'\t' read -r number head base draft; do
            [[ -z "$number" || "$draft" == "true" || "$base" != "$DEFAULT_BRANCH" ]] && continue

            checks="$(gh pr checks "$number" --repo "$GH_REPO" --json name,state)"
            count="$(jq 'length' <<<"$checks")"
            all_passed="$(jq 'length > 0 and all(.[]; .state == "SUCCESS")' <<<"$checks")"

            if [[ "$count" -gt 0 && "$all_passed" == "true" ]]; then
              echo "All reported checks passed for PR #$number; requesting GitHub auto-merge."
              gh pr merge "$number" --repo "$GH_REPO" --merge --auto
              echo "- PR #$number (`$head`): all reported checks passed; auto-merge requested." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- PR #$number (`$head`): left untouched (missing, pending or failing checks)." >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(jq -r '.[] | [.number, .headRefName, .baseRefName, (.isDraft|tostring)] | @tsv' <<<"$prs_json")
