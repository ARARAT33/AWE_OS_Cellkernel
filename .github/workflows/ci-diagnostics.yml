name: CI Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    name: cargo failure diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Collect cargo diagnostics
        shell: bash
        run: |
          {
            echo "## CI diagnostics (head ${{ github.sha }})"
            echo '~~~text'
            cargo --version --verbose 2>&1 || true
            echo '--- cargo fetch ---'
            cargo fetch 2>&1 || echo "FETCH_EXIT=$?"
            echo '--- cargo check workspace (tail 60) ---'
            cargo check --workspace 2>&1 | tail -n 60
            echo "CHECK_EXIT=${PIPESTATUS[0]}"
            echo '~~~'
          } > /tmp/diag.txt
          cat /tmp/diag.txt

      - name: Comment diagnostics on PR
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/diag.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
