name: AWEOS VirtIO Runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: virtio-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  virtio-block-contract-and-qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
          components: rustfmt

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-virtio-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-virtio-cargo-

      - name: Install QEMU and boot-image tools
        run: sudo apt-get update && sudo apt-get install -y grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Enforce formatting
        run: cargo fmt --all -- --check

      - name: Run storage and driver contract tests
        shell: bash
        run: |
          set +e
          cargo test --workspace --all-targets 2>&1 | tee /tmp/cargo-test-all.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "## cargo test --workspace --all-targets failed (exit $code)"
              echo '~~~text'
              tail -n 200 /tmp/cargo-test-all.log
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: Comment test failure tail on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let tail = '';
            try { tail = require('child_process').execSync('tail -n 200 /tmp/cargo-test-all.log').toString(); } catch (e) { tail = 'log unavailable: ' + e.message; }
            const body = `## virtio test step failure (head ${{ github.sha }})\n~~~text\n${tail}\n~~~`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 60000)
            });
      - name: Build kernel
        env:
          AWEOS_QEMU_SMOKE: "1"
        run: cargo build --release -p aweos-kernel-bin --target x86_64-unknown-none

      - name: Validate kernel ELF
        run: |
          file target/x86_64-unknown-none/release/aweos
          grub-file --is-x86-multiboot2 target/x86_64-unknown-none/release/aweos

      - name: Build QEMU boot image
        run: |
          set -euo pipefail
          mkdir -p dist/iso/boot/grub
          cp target/x86_64-unknown-none/release/aweos dist/iso/boot/aweos
          cp kernel-bin/grub.cfg dist/iso/boot/grub/grub.cfg
          grub-mkrescue -o dist/aweos-x86_64.iso dist/iso
          truncate -s 64M dist/virtio-disk.img
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'qemu=%s\n' "$(qemu-system-x86_64 --version | head -n 1)"
            printf 'rustc=%s\n' "$(rustc --version)"
            sha256sum dist/aweos-x86_64.iso dist/virtio-disk.img
          } > dist/artifact-manifest.txt

      - name: Verify QEMU exposes VirtIO block transport
        run: |
          qemu-system-x86_64 -device help | grep -E '^name "virtio-blk-pci"'

      - name: QEMU boot with VirtIO block device
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/qemu-virtio.qmp dist/qemu-virtio.log dist/qemu-virtio-debug.log
          qemu-system-x86_64 \
            -M q35 \
            -m 512M \
            -cdrom dist/aweos-x86_64.iso \
            -drive if=none,id=aweblk,format=raw,file=dist/virtio-disk.img \
            -device virtio-blk-pci,drive=aweblk \
            -display none \
            -serial file:dist/qemu-virtio.log \
            -qmp unix:dist/qemu-virtio.qmp,server=on,wait=off \
            -no-reboot \
            -no-shutdown \
            -d guest_errors,cpu_reset \
            -D dist/qemu-virtio-debug.log \
            > dist/qemu-host.log 2>&1 &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true; wait "$qemu_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            [ -S dist/qemu-virtio.qmp ] && break
            sleep 0.5
          done
          test -S dist/qemu-virtio.qmp

          python3 - <<'PY'
          import json
          import socket
          from pathlib import Path

          sock_path = Path("dist/qemu-virtio.qmp")
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.settimeout(5)
          s.connect(str(sock_path))
          greeting = s.recv(65536).decode("utf-8", "replace")
          s.sendall((json.dumps({"execute": "qmp_capabilities", "id": 1}) + "\r\n").encode())
          caps = s.recv(65536).decode("utf-8", "replace")
          s.sendall((json.dumps({"execute": "query-pci", "id": 2}) + "\r\n").encode())
          data = s.recv(262144).decode("utf-8", "replace")
          s.close()

          parsed = json.loads(data)
          devices = [d for bus in parsed.get("return", []) for d in bus.get("devices", [])]
          virtio = []
          for d in devices:
              vendor = d.get("vendor_id")
              if vendor is None and "id" in d and isinstance(d["id"], dict):
                  vendor = d["id"].get("vendor")
              device = d.get("device_id")
              if device is None and "id" in d and isinstance(d["id"], dict):
                  device = d["id"].get("device")
              if vendor == 0x1AF4 and device is not None and device in range(0x1000, 0x1080):
                  virtio.append(d)

          evidence = {
              "qmp_socket_present": True,
              "qmp_greeting_present": bool(greeting),
              "qmp_capabilities_ok": '"return": {}' in caps,
              "pci_device_count": len(devices),
              "virtio_pci_devices": virtio,
              "virtio_pci_vendor_id": "0x1af4",
              "virtio_pci_device_id_range": "0x1000-0x107f",
              "query_pci_response": parsed,
          }
          Path("dist/qemu-device-evidence.json").write_text(json.dumps(evidence, indent=2))
          if not evidence["qmp_capabilities_ok"]:
              raise SystemExit("QMP capabilities negotiation failed")
          if not virtio:
              raise SystemExit("QEMU query-pci did not expose a VirtIO PCI device")
          PY

          sleep 3
          kill "$qemu_pid" 2>/dev/null || true
          wait "$qemu_pid" 2>/dev/null || true
          trap - EXIT

          cat dist/qemu-virtio.log || true
          cat dist/qemu-host.log || true
          cat dist/qemu-virtio-debug.log || true
          grep -q "AWEOS: boot protocol validated" dist/qemu-virtio.log
          grep -q "AWEOS: kernel state = RUNNING" dist/qemu-virtio.log
          grep -q "AWEOS: kernel is alive" dist/qemu-virtio.log

      - name: Publish VirtIO runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aweos-virtio-runtime-evidence
          path: |
            dist/aweos-x86_64.iso
            dist/virtio-disk.img
            dist/artifact-manifest.txt
            dist/qemu-virtio.log
            dist/qemu-host.log
            dist/qemu-virtio-debug.log
            dist/qemu-device-evidence.json
            /tmp/cargo-test-all.log
          if-no-files-found: warn
