name: AWEOS Bootable Image Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boot-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-boot-image-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-boot-image-

      - name: Install QEMU and ISO Tools
        run: sudo apt-get update && sudo apt-get install -y grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Build kernel binary
        env:
          AWEOS_QEMU_SMOKE: "1"
        run: cargo build --release -p aweos-kernel-bin --target x86_64-unknown-none

      - name: Validate Multiboot2 Header
        run: grub-file --is-x86-multiboot2 target/x86_64-unknown-none/release/aweos

      - name: Generate Bootable ISO & GPT Disk Image
        run: |
          python3 scripts/make_images.py
          mkdir -p dist/iso/boot/grub
          cp target/x86_64-unknown-none/release/aweos dist/iso/boot/aweos
          cp kernel-bin/grub.cfg dist/iso/boot/grub/grub.cfg
          grub-mkrescue -o dist/aweos-x86_64.iso dist/iso

      - name: Smoke Test Bootable ISO in QEMU
        run: |
          set -euo pipefail
          qemu-system-x86_64 -cdrom dist/aweos-x86_64.iso -display none -serial file:qemu-iso-smoke.log -no-reboot &
          qemu_pid=$!
          for i in $(seq 1 40); do
            if grep -q "AWEOS: kernel is alive" qemu-iso-smoke.log 2>/dev/null; then
              echo "ISO Boot Successful!"
              kill $qemu_pid 2>/dev/null || true
              exit 0
            fi
            sleep 0.5
          done
          echo "ISO Boot Failed or Timed Out!"
          cat qemu-iso-smoke.log 2>/dev/null || true
          kill $qemu_pid 2>/dev/null || true
          exit 1

      - name: Upload Bootable Images
        uses: actions/upload-artifact@v7
        with:
          name: aweos-bootable-images
          path: dist/

  exception-injection-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-exc-selftest-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-exc-selftest-

      - name: Install QEMU and ISO Tools
        run: sudo apt-get update && sudo apt-get install -y grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Lint and check the self-test feature build
        run: |
          cargo clippy -p aweos-kernel --features kernel-selftest -- -D warnings
          cargo check -p aweos-kernel-bin --target x86_64-unknown-none --features selftest

      - name: Run QEMU exception-injection self test
        run: cargo test -p awe-product-core-tests qemu_exception_injection_selftest -- --exact --nocapture
