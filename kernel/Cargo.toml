[package]
name = "aweos-kernel"
version = "0.2.1"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
awe-boot-protocol = { workspace = true }

[features]
# QEMU exception-injection validation builds. Never enable in production
# images: the self-test deliberately faults the CPU to exercise IST paths.
kernel-selftest = []
